# XcodeGen spec. Generate the project with:  cd ios && xcodegen
name: SmellTest
options:
  bundleIdPrefix: com.cognitoagora
  deploymentTarget:
    iOS: "26.0"
packages:
  Firebase:   # Pinned: 12.19.x is the last release with HybridModel (removed in 13.0). See README.
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "12.19.3"
  SmellTestCore:
    path: ../Packages/SmellTestCore
targets:
  SmellTest:
    type: application
    platform: iOS
    sources:
      - path: SmellTest
        excludes:
          - "*.template.plist"
    resources:
      - path: SmellTest/GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: SmellTestCore
      - target: ShareExtension
    entitlements:
      path: SmellTest/SmellTest.entitlements
      properties:
        # App Check only accepts App Attest tokens from Apple's production environment.
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: SmellTest/Info.plist
      properties:
        CFBundleDisplayName: Smell Test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground   # same navy as the startup screen, so no white flash
        # Uses only standard HTTPS, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cognitoagora.smelltest
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"   # bump for every App Store Connect upload (app and extension must match)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO

  # Share sheet: checks shared text on the iPhone only. It has no cloud path.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Shared with the app. CheckEngine's on-device path is the only one the extension calls.
      - path: SmellTest/CheckEngine.swift
      - path: SmellTest/ResultCard.swift
      - path: SmellTest/NoticeCard.swift
      - path: SmellTest/Brand.swift
      - path: SmellTest/ScreenshotReader.swift
      - path: SmellTest/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseCore
      - package: SmellTestCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Smell Test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cognitoagora.smelltest.share
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"   # bump for every App Store Connect upload (app and extension must match)
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
